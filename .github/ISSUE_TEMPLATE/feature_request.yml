name: Feature request
description: Suggest a focused SceneAxis workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the storyboard or spatial-planning problem, not only a proposed control.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Explain whether this affects Shots, Objects, Scene, Characters, References, AI, or export.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundary
      options:
        - label: This request keeps SceneAxis focused on blocking, spatial reasoning, composition, or AI communication.
          required: true
