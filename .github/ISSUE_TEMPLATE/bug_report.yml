name: Bug report
description: Report a reproducible SceneAxis problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private project data, and unlicensed assets before submitting.
  - type: input
    id: version
    attributes:
      label: SceneAxis version
      placeholder: V0.98
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140, Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or console messages when useful.
